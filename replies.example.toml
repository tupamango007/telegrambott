# Шаблоны автоответов. Файл перечитывается перед каждым ответом — перезапуск не нужен.
# В тексте можно использовать {name} — имя собеседника.
# Если вариантов несколько, бот выбирает случайный.

# Часовой пояс для ночного режима
timezone = "Europe/Moscow"

# Обычный ответ, если не сработало ни одно правило
default = [
    "Привет, {name}! Сейчас занят, отвечу чуть позже 🙂",
    "Привет! Не могу сейчас ответить, напишу как освобожусь",
]

# На такие сообщения (целиком) бот не отвечает
skip = ["ок", "окей", "ага", "спасибо", "спс", "пока", "+", "👍"]

# Ночной режим: вместо default в эти часы
[night]
start = 23   # с 23:00
end = 8      # до 08:00
replies = ["Я уже сплю 😴 Отвечу утром"]

# Правила по ключевым словам: срабатывает первое, где нашлось любое слово.
# Регистр и буква «ё» не важны.
[[rules]]
keywords = ["срочно", "важно", "позвони"]
replies = ["Увидел, что срочно — постараюсь ответить как можно скорее"]

[[rules]]
keywords = ["созвон", "встрет", "увидимся"]
replies = ["Давай договоримся чуть позже, сейчас не могу посмотреть планы"]

[[rules]]
keywords = ["как дела", "как ты"]
replies = ["Всё хорошо, спасибо! Сейчас немного занят, напишу позже"]
