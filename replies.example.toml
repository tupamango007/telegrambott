# Шаблоны автоответов. Файл перечитывается перед каждым ответом — перезапуск не нужен.
# В тексте можно использовать:
#   {name}     — имя собеседника
#   {greeting} — «Доброе утро» / «Добрый день» / «Добрый вечер» / «Доброй ночи»
#   ||         — разбить ответ на несколько сообщений подряд, как пишут люди
# Если вариантов несколько, бот выбирает случайный и не повторяет один и тот же подряд.
#
# Стикеры: пришлите стикер боту в личку — он ответит его ID. Добавьте ID в `stickers`
# любого раздела. Если в разделе есть и текст, и стикеры, после текста бот с вероятностью
# sticker_chance пришлёт ещё и стикер. Если только стикеры — ответит стикером.

# Часовой пояс для ночного режима
timezone = "Europe/Moscow"

# Вероятность добавить стикер к тексту (0 — никогда, 1 — всегда)
sticker_chance = 0.5

# На такие сообщения (целиком) бот не отвечает
skip = ["ок", "окей", "ага", "спасибо", "спс", "пока", "+", "👍"]

# Обычный ответ, если не сработало ни одно правило
[default]
replies = [
    "Привет, {name}! || Сейчас занят, отвечу чуть позже 🙂",
    "{greeting}! Не могу сейчас ответить, напишу как освобожусь",
    "о, привет || чуть позже отпишусь, ладно?",
]
# stickers = ["CAACAgIAAxkBAAE..."]

# Если собеседник пишет снова, а бот уже отвечал недавно, — одна уточняющая фраза,
# дальше бот молчит до конца REPLY_COOLDOWN_MINUTES. Пусто — сразу молчит.
[followup]
replies = [
    "я помню, скоро отвечу 🙏",
    "вижу-вижу, чуть позже напишу",
    "ещё немного занят, не теряй меня",
]

# Ночной режим: вместо default в эти часы
[night]
start = 23   # с 23:00
end = 8      # до 08:00
replies = ["Я уже сплю 😴 || Отвечу утром", "{greeting} 🌙 Уже сплю, напишу утром"]
# stickers = ["CAACAgIAAxkBAAE..."]

# Ответ на сообщение, где только стикер(ы). Пусто — на стикеры бот не отвечает.
[on_sticker]
stickers = ["CAACAgIAAxkBAAMEasvD5rEqqLRtcE4uSXpRDDO6MiYAAodLAAIh8JFLwen_q3EHUZs9BA"]
# replies = ["😄"]

# Правила по ключевым словам: срабатывает первое, где нашлось любое слово.
# Регистр и буква «ё» не важны.
# notify = true — о таком сообщении вам придёт оповещение «🚨 Важное», даже если бот
# сейчас не отвечает (выключен, чат на паузе, уже отвечал).
[[rules]]
keywords = ["срочно", "важно", "позвони"]
replies = ["Увидел, что срочно — постараюсь ответить как можно скорее"]
notify = true

[[rules]]
keywords = ["созвон", "встрет", "увидимся"]
replies = ["Давай договоримся чуть позже, сейчас не могу посмотреть планы"]

[[rules]]
keywords = ["как дела", "как ты"]
replies = [
    "Всё хорошо, спасибо! || Сейчас немного занят, напишу позже",
    "норм, спасибо 🙂 || чуть позже расскажу подробнее",
]
